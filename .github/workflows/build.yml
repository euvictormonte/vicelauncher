name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build for Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup fails when its version and package.json's
      # packageManager disagree, so take packageManager's when it is set.
      - name: Read the pnpm version
        id: pnpm
        run: |
          version=$(node -p "((require('./package.json').packageManager || '').match(/^pnpm@([^+]+)/) || [])[1] || '10'")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Type-check the UI
        run: pnpm exec tsc -b

      # The Rust crate embeds dist/ at compile time, so the UI is built before the tests.
      - name: Build the UI
        run: pnpm exec vite build

      - name: Test the launcher
        working-directory: src-tauri
        run: cargo test --locked

      # Optional. Without the secret the build still runs, unsigned; the signing
      # script in tauri.conf.json then does nothing. See docs/FALSE-POSITIVES.md.
      - name: Import the signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host 'No signing certificate is set: this build is unsigned.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          $base64 = $env:WINDOWS_CERTIFICATE -replace '\s', ''
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($base64))
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $pfx
          "VILAUNCHER_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build the launcher and installer
        env:
          NEVES_DISCORD_CLIENT_ID: ${{ vars.NEVES_DISCORD_CLIENT_ID }}
        run: pnpm tauri build

      - name: Print the SHA-256 digests
        run: sha256sum "src-tauri/target/release/Neves Launcher.exe" src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Neves Launcher.exe
        uses: actions/upload-artifact@v4
        with:
          name: Neves Launcher.exe
          path: src-tauri/target/release/Neves Launcher.exe
          if-no-files-found: error

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Neves Launcher-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-linux:
    name: Build for Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Read the pnpm version
        id: pnpm
        run: |
          version=$(node -p "((require('./package.json').packageManager || '').match(/^pnpm@([^+]+)/) || [])[1] || '10'")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebKitGTK and the libraries Tauri links against, plus rpm for the .rpm bundle.
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf rpm

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Type-check the UI
        run: pnpm exec tsc -b

      - name: Build the UI
        run: pnpm exec vite build

      - name: Test the launcher
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build the AppImage, deb and rpm
        env:
          NEVES_DISCORD_CLIENT_ID: ${{ vars.NEVES_DISCORD_CLIENT_ID }}
        run: pnpm tauri build

      # The in-app updater looks for this name (GitHub turns the space into a period).
      - name: Name the AppImage for the updater
        run: |
          mkdir -p linux
          cp src-tauri/target/release/bundle/appimage/*.AppImage "linux/Neves Launcher-x86_64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm linux/
          sha256sum linux/*

      - name: Upload the Linux builds
        uses: actions/upload-artifact@v4
        with:
          name: Neves Launcher-linux
          path: linux/*
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Neves Launcher.exe
          path: release/exe

      - uses: actions/download-artifact@v4
        with:
          name: Neves Launcher-setup
          path: release/installer

      - uses: actions/download-artifact@v4
        with:
          name: Neves Launcher-linux
          path: release/linux

      # GitHub normalizes spaces in this asset name to periods; the in-app updater
      # matches the API name `Neves.Launcher.exe` and verifies its SHA-256 digest.
      - uses: softprops/action-gh-release@v2
        with:
          name: Neves Launcher ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/exe/Neves Launcher.exe
            release/installer/*.exe
            release/linux/*
